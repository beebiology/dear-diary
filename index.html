
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>dear diary</title>

    <style>
        body {
            font-family:Cambria, Cochin, Georgia, Times, 'Times New Roman', serif;
        }

        textarea {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
        }

        button {
            margin-top: 15px;
            padding: 10px 20px;
            cursor: pointer;
        }

        #message {
            margin-top: 20px;
        }


.calendar-navigation {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 20px;
}

#calendarGrid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 4px;
    margin: 20px 0;
}

#calendarGrid button {
    padding: 6px 2px;
    border: 1px solid #ddd;
    border-radius: 6px;
    background: white;
    cursor: pointer;
}

#calendarGrid button.has-entry {
    background: #dcebdc;
    font-weight: bold;
}

#calendarGrid button.selected {
    border: 2px solid #357a38;
}

#calendarGrid .weekday {
    text-align: center;
    font-weight: bold;
}


body {
    margin: 0;
    padding: 30px 2%;
}

#journalSection {
    width: 100%;
    max-width: none;
    margin: 0;
}

.diary-layout {
    display: flex;
    align-items: stretch;
    gap: 30px;
}

.entry-panel {
    flex: 2;
    min-width: 0;
    padding-left: 50px;
}

.calendar-panel  {
    flex: 1;
    padding-right: 50px;
    padding-top: 10px;
}

.calendar-panel h2 {
    padding-top: 2px;
    font-size: 22px;

}

.calendar-panel button {
    margin-top: 5px;
    padding: 5px 20px;

}

.entry-panel textarea {
    width: 90%;
    height: 200px;
    box-sizing: border-box;
}

#answer {
    font-size: 10px;
}

@media (max-width: 700px) {
    .diary-layout {
        flex-direction: column;
    }
    .calendar-panel  {
    flex: 1;
    padding-right: 0px;
    padding-top: 10px;
}
}

    </style>
</head>

<body>

<div class="diary-layout">
        
    <div class="entry-panel">
        <div id="journalSection" hidden></div>
        <h1>dear diary</h1>

        <p id="date"></p>

        <h2>Tell me a little about your day.</h2>

        <textarea
            id="journalEntry"
            placeholder="..."
        ></textarea>

        <br>

        <button id="submitButton">Submit</button>

        <p id="message"></p>
        <div id="answer"></div>
        </div>

    <!-- HISTORY SECTION -->
<div class="calendar-panel">
<section id="historySection">

    <h2>Previous Entries</h2>

    <div class="calendar-navigation">
        <button type="button" id="previousMonth">←</button>
        <h3 id="calendarMonth"></h3>
        <button type="button" id="nextMonth">→</button>
    </div>

    <div id="calendarGrid"></div>
    <div id="historyEntries"></div>
    </div>
</div>
</section>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabaseClient.js"></script>

    <script>
        const dateElement = document.getElementById("date");
        const journalEntry = document.getElementById("journalEntry");
        const submitButton = document.getElementById("submitButton");

        const message = document.getElementById("message");
        const answer = document.getElementById("answer");

        const today = new Date();

        dateElement.textContent = today.toLocaleDateString();

        async function checkLogin() {
    const { data, error } = await supabaseClient.auth.getUser();

    if (error || !data.user) {
        window.location.href = "login.html";
    } else {
        document.getElementById("journalSection").hidden = false;
    }

    await getJournalEntries();
}
checkLogin();

        
submitButton.addEventListener("click", async () => {
    const entry = journalEntry.value.trim();

    if (entry === "") {
        message.textContent = "Please write something first.";
        return;
    }

    submitButton.disabled = true;
    answer.textContent = "";

    try {
        // Get the authenticated user
        const { data, error: userError } =
            await supabaseClient.auth.getUser();

        if (userError || !data.user) {
            throw new Error("Please sign in again.");
        }

        // Save the journal entry
        const { error: insertError } = await supabaseClient
            .from("journal_entries")
            .insert({
                user_id: data.user.id,
                entry_text: entry
            });

        if (insertError) {
            throw new Error(insertError.message);
        }

        journalEntry.value = "Your journal entry was saved.";

        await getJournalEntries();

        if (selectedDate) {
            showEntries(selectedDate);
        }

        // Retrieve the current authentication token
        const { data: sessionData, error: sessionError } =
            await supabaseClient.auth.getSession();

        if (sessionError || !sessionData.session) {
            throw new Error("Unable to retrieve your session.");
        }

        // Request an AI response from Vercel
        answer.textContent = "Thinking...";

        const response = await fetch(
            "https://dear-diary-mu-three.vercel.app/api/ask",
            {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                    "Authorization":
                        `Bearer ${sessionData.session.access_token}`
                },
                body: JSON.stringify({
                    entry: entry
                })
            }
        );

        const result = await response.json();

        if (!response.ok) {
            throw new Error(
                result.error || "AI request failed"
            );
        }

        // Display the AI response
        answer.textContent = result.answer;

    } catch (error) {
        answer.textContent = "";
        message.textContent += " " + error.message;

    } finally {
        submitButton.disabled = false;
    }

});

// THIS IS FOR THE CALENDAR

let journalEntries = [];

async function getJournalEntries() {
    const { data, error } = await supabaseClient
        .from("journal_entries")
        .select("id, entry_date, entry_text")
        .order("entry_date", { ascending: false });

    if (error) {
        console.error("Unable to retrieve journal entries:", error);
        return;
    }
    
    journalEntries = data;
        renderCalendar();
}

function showEntries(date) {
    const container = document.getElementById("historyEntries");

    container.replaceChildren();

    const matchingEntries = journalEntries.filter(
        entry => entry.entry_date === date
    );

    if (matchingEntries.length === 0) {
        container.textContent = "No journal entries for this date.";
        return;
    }

    matchingEntries.forEach(entry => {
        const paragraph = document.createElement("p");
        paragraph.textContent = entry.entry_text;
        container.appendChild(paragraph);
    });
}

// JAVASCRIPT FOR THE CALENDAR


let calendarDate = new Date();
let selectedDate = null;

const calendarMonth = document.getElementById("calendarMonth");
const calendarGrid = document.getElementById("calendarGrid");

function renderCalendar() {
    calendarGrid.replaceChildren();

    const year = calendarDate.getFullYear();
    const month = calendarDate.getMonth();

    calendarMonth.textContent = calendarDate.toLocaleDateString(
        "en-US",
        { month: "long", year: "numeric" }
    );

    const weekdays = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];

    weekdays.forEach(day => {
        const label = document.createElement("div");
        label.className = "weekday";
        label.textContent = day;
        calendarGrid.appendChild(label);
    });

    const firstDay = new Date(year, month, 1).getDay();
    const daysInMonth = new Date(year, month + 1, 0).getDate();

    for (let i = 0; i < firstDay; i++) {
        calendarGrid.appendChild(document.createElement("div"));
    }

    for (let day = 1; day <= daysInMonth; day++) {
        const date = [
            year,
            String(month + 1).padStart(2, "0"),
            String(day).padStart(2, "0")
        ].join("-");

        const button = document.createElement("button");
        button.type = "button";
        button.textContent = day;

        if (journalEntries.some(entry => entry.entry_date === date)) {
            button.classList.add("has-entry");
        }

        if (date === selectedDate) {
            button.classList.add("selected");
        }

        button.addEventListener("click", () => {
            selectedDate = date;
            showEntries(date);
            renderCalendar();
        });

        calendarGrid.appendChild(button);
    }
}

document.getElementById("previousMonth").addEventListener("click", () => {
    calendarDate.setDate(1);
    calendarDate.setMonth(calendarDate.getMonth() - 1);
    renderCalendar();
});

document.getElementById("nextMonth").addEventListener("click", () => {
    calendarDate.setDate(1);
    calendarDate.setMonth(calendarDate.getMonth() + 1);
    renderCalendar();
});



    </script>

</body>
</html>
